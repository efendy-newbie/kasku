name: kasku
description: "KasKu - Aplikasi pencatat keuangan offline-first."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management (per PRD)
  flutter_riverpod: ^2.5.1

  # Storage (per PRD: SQLite offline)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # Charts (per PRD: fl_chart)
  fl_chart: ^0.68.0

  # Formatting
  intl: ^0.19.0

  # IDs
  uuid: ^4.4.0

  # Backup export/import
  share_plus: ^12.0.2
  file_picker: ^10.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
